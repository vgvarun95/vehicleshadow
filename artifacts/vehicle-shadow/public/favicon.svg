  <path d="M45 105 L55 90 C58 85 68 70 85 68 L95 68 C112 70 122 85 125 90 L135 105 C142 108 145 112 145 118 C145 125 138 128 132 128 L48 128 C42 128 35 125 35 118 C35 112 38 108 45 105 Z" fill="#FFFFFF"/>
  
